<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VJ Canvas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="controls">
    <h1>Virtual Jockey Canvas</h1>
    <input type="file" id="audio-upload" accept="audio/*">
    <button id="process-btn" disabled>Process Track</button>
    <div id="status">Upload an audio stem bundle to begin...</div>
  </div>

  <canvas id="visual-canvas"></canvas>

  <script src="app.js"></script>
</body>

</html>
