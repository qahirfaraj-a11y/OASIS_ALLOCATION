name: CI

on:
  push:
    branches: [main, pre-mosaic-backup]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check oasis/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      OASIS_SEED_PASSWORD: ci-test-password
      OASIS_API_KEY: ci-test-api-key
      OASIS_LICENSE_SALT: ci-test-salt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout
      - name: Run tests
        run: python -m pytest tests/ -x -q --timeout=300
