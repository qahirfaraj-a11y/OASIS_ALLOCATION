<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OASIS — Orders &amp; Transfers</title>
<style>
  :root{
    --bg:#0B1012; --panel:#121A1D; --panel2:#182226; --line:#222F34;
    --ink:#E6EEF0; --ink2:#9FB2B7; --ink3:#6B8086;
    --accent:#2ED3C6; --accent-dim:rgba(46,211,198,.14);
    --good:#4CC38A; --warn:#E0A249; --bad:#E2685C;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}

  /* ── status bar: the Echo Earth idea — tell me where I am, live ── */
  .bar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;
       padding:10px 20px;border-bottom:1px solid var(--line);
       background:var(--panel);font-size:12.5px;color:var(--ink2)}
  .brand{font-weight:700;letter-spacing:.16em;color:var(--ink);font-size:12.5px}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;
       margin-right:6px;vertical-align:middle;background:var(--ink3)}
  .dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
  .dot.off{background:var(--bad)}
  .bar .sp{flex:1}

  main{max-width:1180px;margin:0 auto;padding:26px 20px 80px}

  /* ── site picker ── */
  .sites{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .site{background:var(--panel);border:1px solid var(--line);border-radius:3px;
        padding:9px 15px;font-weight:600;font-size:13.5px;color:var(--ink2);
        transition:border-color .12s,color .12s}
  .site:hover{border-color:var(--accent);color:var(--ink)}
  .site[aria-pressed="true"]{border-color:var(--accent);color:#04211F;
        background:var(--accent)}
  .hint{color:var(--ink3);font-size:12.5px;margin:0 0 22px}

  /* ── tabs ── */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px}
  .tab{background:none;border:0;border-bottom:2px solid transparent;
       padding:10px 16px;font-weight:650;font-size:13.5px;color:var(--ink3);
       letter-spacing:.04em}
  .tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

  /* ── stat strip ── */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
         gap:1px;background:var(--line);border:1px solid var(--line);
         border-radius:3px;margin-bottom:20px;overflow:hidden}
  .stat{background:var(--panel);padding:14px 16px}
  .stat .k{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
           color:var(--ink3);font-weight:650}
  .stat .v{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;
           font-variant-numeric:tabular-nums;margin-top:3px}
  .stat .v.sm{font-size:1.05rem}

  /* ── tables ── */
  .wrap{border:1px solid var(--line);border-radius:3px;overflow-x:auto;
        background:var(--panel)}
  table{border-collapse:collapse;width:100%;min-width:760px}
  th{position:sticky;top:0;background:var(--panel2);text-align:left;
     font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
     color:var(--ink3);font-weight:650;padding:10px 12px;
     border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px;
     vertical-align:top}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--panel2)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;
       white-space:nowrap}
  .prod{font-weight:600}
  .sub{display:block;color:var(--ink3);font-size:11.5px;font-family:var(--mono);
       margin-top:2px}
  .why{color:var(--ink3);font-size:11.5px;max-width:280px;display:block}

  .chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;
        text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap}
  .c-good{background:rgba(76,195,138,.14);color:var(--good)}
  .c-warn{background:rgba(224,162,73,.14);color:var(--warn)}
  .c-bad{background:rgba(226,104,92,.14);color:var(--bad)}

  /* ── action bar ── */
  .act{position:sticky;bottom:0;display:flex;gap:12px;align-items:center;
       flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
       border-top-color:var(--accent);border-radius:3px;padding:14px 16px;
       margin-top:16px}
  .btn{background:var(--accent);color:#04211F;border:0;border-radius:3px;
       padding:10px 20px;font-weight:700;letter-spacing:.03em}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:none;color:var(--ink2);border:1px solid var(--line)}

  /* ── states ── */
  .state{padding:52px 20px;text-align:center;color:var(--ink3);
         border:1px dashed var(--line);border-radius:3px}
  .state b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:6px;
           font-weight:650}
  .spin{width:22px;height:22px;border:2px solid var(--line);
        border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;
        animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
  .err{border-color:var(--bad);color:var(--bad)}
  .hide{display:none}
  input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
  /* ── filter + sort controls ── */
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .controls input[type=search],.controls select{
    background:var(--panel);border:1px solid var(--line);border-radius:3px;
    color:var(--ink);padding:8px 11px;font-family:inherit;font-size:13px;min-width:150px}
  .controls input[type=search]{min-width:250px;flex:1}
  .controls input[type=search]:focus,.controls select:focus{
    outline:none;border-color:var(--accent)}
  .controls .chk{display:flex;align-items:center;gap:6px;color:var(--ink2);
    font-size:13px;white-space:nowrap;cursor:pointer}
  .btn.sm{padding:7px 13px;font-size:12.5px;font-weight:600}
  .muted{color:var(--ink3);font-size:12.5px}
  .sp{flex:1}

  /* ── methodology banner: transfers precede orders ── */
  .method{border:1px solid var(--accent);border-left-width:3px;border-radius:3px;
    background:rgba(46,211,198,.06);padding:13px 16px;margin:0 0 20px}
  .method b{display:block;color:var(--accent);font-size:13.5px;font-weight:650;
    margin-bottom:3px}
  .method span{color:var(--ink2);font-size:13px}
  .method.quiet{border-color:var(--line);background:var(--panel)}
  .method.quiet b{color:var(--ink2)}
  .sub-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;
    font-weight:650;color:var(--ink3);margin:22px 0 10px}
  .storerow:hover{background:var(--panel2)}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

</style>
</head>
<body>

<div class="bar">
  <span class="brand">O·A·S·I·S</span>
  <span><span class="dot" id="dot"></span><span id="conn">connecting…</span></span>
  <span id="backend"></span>
  <span id="siteinfo"></span>
  <span class="sp"></span>
  <span id="clock"></span>
</div>

<main>
  <div class="sites" id="sites"></div>
  <p class="hint" id="hint">Pick a store to see what it should order.</p>

  <div class="tabs" role="tablist">
    <button class="tab" id="t-orders" role="tab" aria-selected="true">ORDERS</button>
    <button class="tab" id="t-transfers" role="tab" aria-selected="false">TRANSFERS</button>
  </div>

  <section id="panel-orders">
    <div id="orders-stats"></div>
    <div id="orders-body"><div class="state"><b>No store selected</b>Choose one above.</div></div>
  </section>

  <section id="panel-transfers" class="hide">
    <div id="tr-stats"></div>
    <div id="tr-body"><div class="state"><b>Not scanned yet</b>Open this tab to scan the network.</div></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const money = n => 'KES ' + (Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const num = n => (Number(n)||0).toLocaleString(undefined,{maximumFractionDigits:0});
let SITE = null, ORDERS = null, TRANSFERS = null, TAB = 'orders';
let SELECTED = new Set(), VIEW = {q:'',supplier:'',dept:'',outOnly:false,sort:'value',dir:-1};

function tick(){ $('#clock').textContent = new Date().toLocaleTimeString(); }
setInterval(tick, 1000); tick();

async function j(url, opts){
  const r = await fetch(url, opts);
  if(!r.ok){ let d; try{ d = (await r.json()).detail }catch(e){ d = r.statusText }
             throw new Error(d || ('HTTP '+r.status)); }
  return r.json();
}

async function boot(){
  try{
    const h = await j('/api/health');
    $('#dot').className = 'dot ' + (h.connected ? 'on' : 'off');
    $('#conn').textContent = h.connected ? 'connected' : (h.error || 'not connected');
    $('#backend').textContent = h.backend + (h.latency_ms ? ' · '+h.latency_ms+' ms' : '');
  }catch(e){ $('#dot').className='dot off'; $('#conn').textContent = e.message; }

  try{
    const s = await j('/api/sites');
    const box = $('#sites');
    if(!s.sites.length){ box.innerHTML = '<div class="state err"><b>No stores found</b>'+(s.error||'The backend returned no organisations.')+'</div>'; return; }
    box.innerHTML = '';
    s.sites.forEach((site,i) => {
      const b = document.createElement('button');
      b.className = 'site'; b.textContent = site.name || site.org_cd;
      b.setAttribute('aria-pressed','false');
      b.onclick = () => pick(site, b);
      box.appendChild(b);
      if(i===0) setTimeout(()=>pick(site,b), 0);   // land and it works
    });
  }catch(e){ $('#sites').innerHTML = '<div class="state err"><b>Could not list stores</b>'+e.message+'</div>'; }
}

function pick(site, btn){
  SITE = site; ORDERS = null;
  document.querySelectorAll('.site').forEach(x=>x.setAttribute('aria-pressed','false'));
  btn.setAttribute('aria-pressed','true');
  $('#siteinfo').textContent = '· ' + (site.name || site.org_cd);
  $('#hint').textContent = 'Recommendations are generated live from the connected system each time you select a store.';
  if(TAB==='orders') loadOrders();
}

function show(tab){
  TAB = tab;
  $('#t-orders').setAttribute('aria-selected', tab==='orders');
  $('#t-transfers').setAttribute('aria-selected', tab==='transfers');
  $('#panel-orders').classList.toggle('hide', tab!=='orders');
  $('#panel-transfers').classList.toggle('hide', tab!=='transfers');
  if(tab==='orders' && SITE && !ORDERS) loadOrders();
  if(tab==='transfers' && !TRANSFERS) loadTransfers();
}
$('#t-orders').onclick = ()=>show('orders');
$('#t-transfers').onclick = ()=>show('transfers');

function working(el, msg, sub){
  el.innerHTML = '<div class="state"><div class="spin"></div><b>'+esc(msg)+'</b>'+
    '<span id="jobstep" style="display:block">'+esc(sub||'')+'</span>'+
    '<span id="jobtime" style="display:block;margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink3)"></span></div>';
}

/* Start a job, then poll it. The engine is not a web request: on a full
   catalogue a synchronous call does not return inside any sane timeout. */
async function runJob(startUrl, el, title){
  working(el, title, 'Starting…');
  const job = await j(startUrl, {method:'POST'});
  let delay = 400;
  for(;;){
    await new Promise(r => setTimeout(r, delay));
    delay = Math.min(delay * 1.35, 2500);        // back off, stay responsive early
    let s;
    try{ s = await j('/api/jobs/'+job.id); }
    catch(e){ throw new Error('Lost track of the run: '+e.message); }
    const step = document.getElementById('jobstep');
    const tm = document.getElementById('jobtime');
    if(step && s.step) step.textContent = s.step;
    if(tm) tm.textContent = s.elapsed + 's elapsed';
    if(s.status === 'done') return s.result;
    if(s.status === 'error') throw new Error(s.error || 'The run failed.');
  }
}

/* ── ORDERS ─────────────────────────────────────────────────────────── */
async function loadOrders(){
  if(!SITE) return;
  $('#orders-stats').innerHTML = '';
  try{
    ORDERS = await runJob('/api/jobs/orders/'+encodeURIComponent(SITE.org_cd),
      $('#orders-body'), 'Running the ordering engine for '+(SITE.name||SITE.org_cd));
    renderOrders();
  }catch(e){
    $('#orders-body').innerHTML = '<div class="state err"><b>Could not generate orders</b>'+e.message+'</div>';
  }
}

function renderOrders(){
  const t = ORDERS.totals, f = ORDERS.funnel || {};
  $('#orders-stats').innerHTML =
    '<div class="stats">'+
    stat('Lines to order', num(t.lines))+
    stat('Order value', money(t.value), true)+
    stat('Suppliers', num(t.suppliers))+
    (f.no_order_needed!=null ? stat('No order needed', num(f.no_order_needed)) : '')+
    (f.below_moq!=null ? stat('Below MOQ', num(f.below_moq)) : '')+
    '</div>';

  // The methodology, stated on screen. generate_smart_orders is
  // engine -> network -> MOQ gate, and NetworkPlan defines adjusted_orders as
  // "original - transfer fulfillments" — so this order is ALREADY net of
  // everything a transfer could cover. Transfers take precedence over buying.
  // If that is the sell point, it has to be visible, not implied.
  const nw = ORDERS.network || {};
  if(nw.items_transferred || (nw.transfers && nw.transfers.length)){
    $('#orders-stats').innerHTML +=
      '<div class="method">'+
      '<b>Transfers were applied before this order was calculated.</b>'+
      '<span>'+num(nw.items_transferred)+' line'+(nw.items_transferred===1?'':'s')+
      ' covered by moving '+num(nw.units_transferred)+' units between stores'+
      (nw.savings_kes ? ', saving '+money(nw.savings_kes)+' against buying them' : '')+
      '. '+num(nw.orders_reduced)+' order line'+(nw.orders_reduced===1?'':'s')+
      ' reduced as a result'+
      (nw.donor_additions ? '; '+num(nw.donor_additions)+' line'+
        (nw.donor_additions===1?'':'s')+' added to donor orders to compensate' : '')+
      '.</span></div>';
  } else if(ORDERS.network){
    $('#orders-stats').innerHTML +=
      '<div class="method quiet"><b>No transfers could cover any of this order.</b>'+
      '<span>Every line below has to be bought — nothing in the network had '+
      'spare cover to move instead.</span></div>';
  }

  if(!ORDERS.rows.length){
    $('#orders-body').innerHTML = '<div class="state"><b>Nothing to order</b>'+
      'Every SKU has enough cover, or is already on order.</div>';
    return;
  }

  // Selection is keyed on SKU, never on row index. Sorting or filtering
  // reorders the array, so an index-keyed checkbox would silently move a tick
  // from one product to another and the operator would send lines they never
  // chose.
  SELECTED = new Set(ORDERS.rows.map(r => r.item_code));
  VIEW = {q:'', supplier:'', dept:'', outOnly:false, sort:'value', dir:-1};

  const suppliers = [...new Set(ORDERS.rows.map(r=>r.supplier))].sort();
  const depts = [...new Set(ORDERS.rows.map(r=>r.department).filter(Boolean))].sort();

  $('#orders-body').innerHTML =
    '<div class="controls">'+
      '<input id="q" type="search" placeholder="Search product, SKU or supplier...">'+
      '<select id="fsup"><option value="">All suppliers ('+suppliers.length+')</option>'+
        suppliers.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select>'+
      '<select id="fdept"><option value="">All departments ('+depts.length+')</option>'+
        depts.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select>'+
      '<label class="chk"><input type="checkbox" id="fout"> Out of stock only</label>'+
      '<button class="btn ghost sm" id="clearf">Clear</button>'+
      '<span class="sp"></span><span id="shown" class="muted"></span>'+
    '</div>'+
    '<div id="tablehost"></div>'+
    '<div class="act">'+
      '<button class="btn" id="pushbtn">Send <span id="cnt"></span> to draft orders</button>'+
      '<span id="pickval" class="muted"></span>'+
      '<span id="hiddenwarn" class="muted"></span>'+
      '<span class="sp"></span>'+
      '<span class="muted">Drafts only - nothing is confirmed, no money is committed.</span>'+
    '</div><div id="pushmsg" style="margin-top:10px"></div>';

  $('#q').oninput = e => { VIEW.q = e.target.value.trim().toLowerCase(); drawRows(); };
  $('#fsup').onchange = e => { VIEW.supplier = e.target.value; drawRows(); };
  $('#fdept').onchange = e => { VIEW.dept = e.target.value; drawRows(); };
  $('#fout').onchange = e => { VIEW.outOnly = e.target.checked; drawRows(); };
  $('#clearf').onclick = () => {
    VIEW.q=''; VIEW.supplier=''; VIEW.dept=''; VIEW.outOnly=false;
    $('#q').value=''; $('#fsup').value=''; $('#fdept').value=''; $('#fout').checked=false;
    drawRows();
  };
  $('#pushbtn').onclick = doPush;
  drawRows();
}

const SORTS = {
  product:  (a,b) => String(a.product||'').localeCompare(String(b.product||'')),
  supplier: (a,b) => String(a.supplier||'').localeCompare(String(b.supplier||'')),
  stock:    (a,b) => a.stock - b.stock,
  ads:      (a,b) => a.ads - b.ads,
  qty:      (a,b) => a.qty - b.qty,
  value:    (a,b) => a.value - b.value
};

function visibleRows(){
  const v = VIEW;
  let rows = ORDERS.rows.filter(r => {
    if(v.supplier && r.supplier !== v.supplier) return false;
    if(v.dept && r.department !== v.dept) return false;
    if(v.outOnly && !(r.stock <= 0)) return false;
    if(v.q){
      const hay = (r.product+' '+r.item_code+' '+r.supplier+' '+(r.department||'')).toLowerCase();
      if(!hay.includes(v.q)) return false;
    }
    return true;
  });
  const cmp = SORTS[v.sort] || SORTS.value;
  rows.sort((a,b) => cmp(a,b) * v.dir);
  return rows;
}

function drawRows(){
  const rows = visibleRows();
  const arrow = k => VIEW.sort===k ? (VIEW.dir<0 ? ' \u25be' : ' \u25b4') : '';
  const th = (k,label,cls) => '<th class="'+(cls||'')+' sortable" data-k="'+k+'">'+label+arrow(k)+'</th>';

  if(!rows.length){
    $('#tablehost').innerHTML = '<div class="state"><b>Nothing matches</b>'+
      'No line matches these filters. Clear them to see all '+ORDERS.rows.length+'.</div>';
  } else {
    let h = '<div class="wrap"><table><thead><tr>'+
      '<th><input type="checkbox" id="all"></th>'+
      th('product','Product')+th('supplier','Supplier')+
      th('stock','Stock','num')+th('ads','ADS','num')+
      th('qty','Qty','num')+th('value','Value','num')+
      '<th>Why</th></tr></thead><tbody>';
    rows.forEach(r => {
      const on = SELECTED.has(r.item_code);
      h += '<tr><td><input type="checkbox" class="pick" data-k="'+esc(r.item_code)+'"'+(on?' checked':'')+'></td>'+
        '<td><span class="prod">'+esc(r.product||'')+'</span>'+
          '<span class="sub">'+esc(r.item_code||'')+' \u00b7 '+esc(r.department||'')+'</span></td>'+
        '<td>'+esc(r.supplier)+'</td>'+
        '<td class="num">'+(r.stock<=0?'<span class="chip c-bad">OUT</span>':num(r.stock))+'</td>'+
        '<td class="num">'+(Number(r.ads)||0).toFixed(1)+'</td>'+
        '<td class="num">'+num(r.qty)+'</td>'+
        '<td class="num">'+money(r.value)+'</td>'+
        '<td><span class="why">'+esc((r.reasoning||'').slice(0,120))+'</span></td></tr>';
    });
    h += '</tbody></table></div>';
    $('#tablehost').innerHTML = h;

    document.querySelectorAll('th.sortable').forEach(el => {
      el.onclick = () => {
        const k = el.dataset.k;
        if(VIEW.sort === k) VIEW.dir = -VIEW.dir;
        else { VIEW.sort = k; VIEW.dir = (k==='product'||k==='supplier') ? 1 : -1; }
        drawRows();
      };
    });
    // "Select all" acts on what is VISIBLE. Acting on hidden rows is how a
    // filtered table sends things the operator cannot see.
    const allBox = $('#all');
    allBox.checked = rows.every(r => SELECTED.has(r.item_code));
    allBox.onchange = e => {
      rows.forEach(r => e.target.checked ? SELECTED.add(r.item_code)
                                         : SELECTED.delete(r.item_code));
      drawRows();
    };
    document.querySelectorAll('.pick').forEach(c => c.onchange = e => {
      e.target.checked ? SELECTED.add(e.target.dataset.k)
                       : SELECTED.delete(e.target.dataset.k);
      sel();
    });
  }
  $('#shown').textContent = rows.length === ORDERS.rows.length
    ? ORDERS.rows.length + ' lines'
    : rows.length + ' of ' + ORDERS.rows.length + ' lines';
  sel();
}

function picked(){ return ORDERS.rows.filter(r => SELECTED.has(r.item_code)); }

function sel(){
  const p = picked();
  const v = p.reduce((a,r)=>a+(r.value||0),0);
  const btn = $('#pushbtn');
  if(btn){ btn.disabled = !p.length; $('#cnt').textContent = p.length + (p.length===1?' line':' lines'); }
  const pv = $('#pickval'); if(pv) pv.textContent = p.length ? money(v) : 'nothing selected';
  // If a filter hides selected lines, say so. Sending what you cannot see is
  // the classic filtered-table surprise.
  const vis = new Set(visibleRows().map(r=>r.item_code));
  const hidden = p.filter(r => !vis.has(r.item_code)).length;
  const hw = $('#hiddenwarn');
  if(hw) hw.textContent = hidden ? '\u00b7 includes '+hidden+' hidden by the current filter' : '';
  return p;
}

async function doPush(){
  const p = picked(); if(!p.length) return;
  const btn = $('#pushbtn'); btn.disabled = true; btn.textContent = 'Sending...';
  try{
    const res = await j('/api/orders/'+encodeURIComponent(SITE.org_cd)+'/push',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rows: p.map(r=>({
        item_code:r.item_code, product_name:r.product, supplier_cd:r.supplier_cd,
        supplier_name:r.supplier, recommended_quantity:r.qty, cost_price:r.cost,
        reasoning:r.reasoning}))})
    });
    $('#pushmsg').innerHTML = '<div class="state" style="border-color:var(--good);color:var(--good);padding:18px">'+
      '<b style="color:var(--good)">'+res.pushed+' lines sent as drafts</b>'+
      'Open your ERP to review and approve them.</div>';
    btn.textContent = 'Sent';
  }catch(e){
    $('#pushmsg').innerHTML = '<div class="state err" style="padding:18px"><b>Push failed</b>'+esc(e.message)+'</div>';
    btn.disabled = false; btn.textContent = 'Retry send';
  }
}

/* ── TRANSFERS ──────────────────────────────────────────────────────── */
async function loadTransfers(){
  $('#tr-stats').innerHTML='';
  try{
    TRANSFERS = await runJob('/api/jobs/transfers', $('#tr-body'), 'Scanning the network');
    renderTransfers();
  }catch(e){
    $('#tr-body').innerHTML = '<div class="state err"><b>Scan failed</b>'+e.message+'</div>';
  }
}

function renderTransfers(){
  const t = TRANSFERS.totals||{}, ops = TRANSFERS.opportunities||[];
  if(TRANSFERS.error && !ops.length){
    $('#tr-body').innerHTML = '<div class="state"><b>Nothing to transfer</b>'+esc(TRANSFERS.error)+'</div>';
    return;
  }
  $('#tr-stats').innerHTML = '<div class="stats">'+
    stat('Moves found', num(t.moves != null ? t.moves : ops.length))+
    stat('Pull / Push', num(t.pull||0)+' / '+num(t.push||0))+
    (t.below_transfer_cost ? stat('Below transfer cost', num(t.below_transfer_cost)) : '')+
    stat('Value moved', money(t.total_value||0), true)+
    stat('SKUs', num(t.unique_skus||0))+
    stat('Store pairs', num(t.store_pairs||0))+
    (t.blocked ? stat('Cannot execute', num(t.blocked)) : '')+
    (t.manual_only ? stat('Need a human', num(t.manual_only)) : '')+
    '</div>';
  if(!ops.length){
    $('#tr-body').innerHTML='<div class="state"><b>No moves worth making</b>Cover is balanced across the network.</div>';
    return;
  }
  // Procurement works store by store, so lead with the roll-up.
  let h = '';
  const bs = TRANSFERS.by_store || [];
  if(bs.length){
    h += '<h3 class="sub-h">By store</h3><div class="wrap"><table><thead><tr>'+
      '<th>Store</th><th class="num">Pull in</th><th class="num">Value in</th>'+
      '<th class="num">Push out</th><th class="num">Value out</th>'+
      '<th class="num">Blocked</th><th class="num">Review</th></tr></thead><tbody>';
    bs.forEach(r=>{
      h += '<tr class="storerow" data-org="'+esc(r.org_cd)+'">'+
        '<td><span class="prod">'+esc(r.name)+'</span><span class="sub">'+esc(r.org_cd)+'</span></td>'+
        '<td class="num">'+num(r.pull_in_n)+'</td><td class="num">'+money(r.pull_in_value)+'</td>'+
        '<td class="num">'+num(r.push_out_n)+'</td><td class="num">'+money(r.push_out_value)+'</td>'+
        '<td class="num">'+(r.blocked_n?'<span class="chip c-bad">'+num(r.blocked_n)+'</span>':'0')+'</td>'+
        '<td class="num">'+(r.review_n?'<span class="chip c-warn">'+num(r.review_n)+'</span>':'0')+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  const orgs=[...new Set(ops.flatMap(o=>[o.from_org,o.to_org]))].sort();
  h += '<h3 class="sub-h">Moves</h3><div class="controls">'+
    '<select id="tsite"><option value="">All stores</option>'+
      orgs.map(o=>'<option>'+esc(o)+'</option>').join('')+'</select>'+
    '<select id="tside"><option value="">Sending or receiving</option>'+
      '<option value="to">Receiving only</option><option value="from">Sending only</option></select>'+
    '<select id="ttype"><option value="">Pull and push</option>'+
      '<option>PULL</option><option>PUSH</option></select>'+
    '<button class="btn ghost sm" id="tclear">Clear</button>'+
    '<span class="sp"></span><span id="tshown" class="muted"></span></div>'+
    '<div id="thost"></div>';
  $('#tr-body').innerHTML = h;
  $('#tsite').onchange = $('#tside').onchange = $('#ttype').onchange = drawTransfers;
  $('#tclear').onclick = ()=>{ $('#tsite').value=''; $('#tside').value='';
                               $('#ttype').value=''; drawTransfers(); };
  document.querySelectorAll('.storerow').forEach(tr=>{
    tr.style.cursor='pointer';
    tr.onclick = ()=>{ $('#tsite').value = tr.dataset.org; drawTransfers();
                       $('#thost').scrollIntoView({behavior:'smooth',block:'start'}); };
  });
  drawTransfers();
}

function drawTransfers(){
  const ops = TRANSFERS.opportunities||[];
  const site=$('#tsite').value, side=$('#tside').value, type=$('#ttype').value;
  const rows = ops.filter(o=>{
    if(type && o.type !== type) return false;
    if(site){
      if(side==='to'   && o.to_org   !== site) return false;
      if(side==='from' && o.from_org !== site) return false;
      if(!side && o.to_org !== site && o.from_org !== site) return false;
    }
    return true;
  });
  $('#tshown').textContent = rows.length + ' of ' + ops.length + ' shown'+
    (TRANSFERS.truncated ? ' · highest value ' + num(TRANSFERS.returned) +
      ' of ' + num((TRANSFERS.totals||{}).moves) + ' sent to this page' : '');
  if(!rows.length){
    $('#thost').innerHTML='<div class="state"><b>Nothing matches</b>Clear the filters to see all.</div>';
    return;
  }
  let h='<div class="wrap"><table><thead><tr><th>Type</th><th>Product</th><th>From</th><th>To</th>'+
    '<th class="num">Qty</th><th class="num">Value</th><th class="num">Donor cover</th>'+
    '<th class="num">Receiver cover</th><th></th></tr></thead><tbody>';
  rows.forEach(o=>{
    const tight = (o.recipient_cover!=null && o.recipient_cover<=1);
    h+='<tr><td><span class="chip '+(o.type==='PUSH'?'c-warn':'c-good')+'">'+esc(o.type||'')+'</span></td>'+
       '<td><span class="prod">'+esc(o.product||'')+'</span>'+
       '<span class="sub">'+esc(o.itm_cd||'')+' · '+esc(o.department||'')+'</span></td>'+
       '<td>'+esc(o.from||o.from_org)+'</td><td>'+esc(o.to||o.to_org)+'</td>'+
       '<td class="num">'+num(o.qty)+'</td><td class="num">'+money(o.value)+'</td>'+
       '<td class="num">'+fmtd(o.donor_cover)+'</td>'+
       '<td class="num">'+(tight?'<span class="chip c-bad">'+fmtd(o.recipient_cover)+'</span>':fmtd(o.recipient_cover))+'</td>'+
       '<td>'+statusChip(o)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  $('#thost').innerHTML = h;
  const blocked = rows.filter(o=>o.executable===false);
  if(blocked.length){
    const reasons = [...new Set(blocked.map(o=>o.blocked_reason).filter(Boolean))];
    h+='<div class="state err" style="text-align:left;padding:16px;margin-top:14px">'+
       '<b style="color:var(--bad)">'+blocked.length+' of these cannot be executed by the connected system</b>'+
       reasons.map(r=>'<div style="margin-top:6px">· '+esc(r)+'</div>').join('')+
       '<div style="margin-top:10px;color:var(--ink3)">The stock imbalance is real — the route is not. '+
       'Move these another way, or resolve the obstacle above.</div></div>';
  }
  let tail='<p class="hint" style="margin-top:12px">'+
     'This is a network-wide scan for stock worth moving. It is a different question from the transfers already applied inside an order run, which are shown on the Orders tab. Lines marked <b>Review</b> are perishable — moving them is a judgement about shelf life, not a number, so OASIS never queues them automatically.</p>';
  $('#tr-body').innerHTML=h;
}

function statusChip(o){
  // A move the ERP will refuse must not read as "Ready". The reason comes
  // from the adapter, so it names the real obstacle rather than a generic
  // failure the operator would have to go and diagnose.
  if(o.executable === false)
    return '<span class="chip c-bad" title="'+esc(o.blocked_reason||'')+'">Blocked</span>';
  if(o.manual_only) return '<span class="chip c-warn">Review</span>';
  return '<span class="chip c-good">Ready</span>';
}
const fmtd = v => v==null ? '—' : (Number(v)||0).toFixed(1)+'d';
const stat = (k,v,big) => '<div class="stat"><div class="k">'+k+'</div><div class="v'+(big?'':' sm')+'">'+v+'</div></div>';
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

boot();
</script>
</body>
</html>
