# ============================================================
# OASIS ⇄ Odoo — full integration stack (evaluation / demo)
# ============================================================
# Brings up everything needed to see OASIS live against a real Odoo:
#   odoo-db     PostgreSQL for Odoo
#   odoo-init   one-shot: creates the 'oasis' DB and installs the connector
#   odoo        Odoo 16 server (with the OASIS connector addon mounted)
#   oasis-hub   OASIS Cloud Hub (licensing + ingestion + supplier portal)
#
# Run from this directory (connectors/odoo/):
#   docker compose -f docker-compose.odoo.yml up -d --build
#   export OASIS_HUB_ADMIN_KEY=$(openssl rand -hex 16)   # or set in .env
#   python bootstrap_hub.py            # provision hub, prints the ingest token
#   python configure_and_sync.py       # point Odoo at the hub, seed + sync
# Then open the portal:  http://localhost:8700/portal-app/
#   (login printed by bootstrap_hub.py — no fixed demo password)
#
# Odoo reaches the hub in-network at http://oasis-hub:8700.
# Secrets must be provided via .env / environment (no fixed demo values).
# ============================================================

name: oasis-odoo

services:
  odoo-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: create the 'oasis' DB (with demo data) and install the connector.
  odoo-init:
    image: odoo:16
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:              # the image's entrypoint waits on HOST (default "db")
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    volumes:
      # Every OASIS addon is mounted separately, and that is deliberate:
      # mounting the whole connectors/odoo directory would put the build
      # and analysis scripts on Odoo's addons path too. Adding a module
      # means adding a line here, or Odoo simply never sees it — it does
      # not error, the module is just absent from the list.
      - ./oasis_connector:/mnt/extra-addons/oasis_connector:ro
      - ./oasis_telemetry:/mnt/extra-addons/oasis_telemetry:ro
      - ./oasis_transfers:/mnt/extra-addons/oasis_transfers:ro
      - odoo-web-data:/var/lib/odoo
    command: >
      odoo -i oasis_connector -d oasis
      --db_host=odoo-db --db_user=odoo --db_password=odoo
      --stop-after-init
    restart: "no"

  odoo:
    image: odoo:16
    depends_on:
      odoo-db:
        condition: service_healthy
      odoo-init:
        condition: service_completed_successfully
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    volumes:
      # Every OASIS addon is mounted separately, and that is deliberate:
      # mounting the whole connectors/odoo directory would put the build
      # and analysis scripts on Odoo's addons path too. Adding a module
      # means adding a line here, or Odoo simply never sees it — it does
      # not error, the module is just absent from the list.
      - ./oasis_connector:/mnt/extra-addons/oasis_connector:ro
      - ./oasis_telemetry:/mnt/extra-addons/oasis_telemetry:ro
      - ./oasis_transfers:/mnt/extra-addons/oasis_transfers:ro
      - odoo-web-data:/var/lib/odoo
    command: >
      odoo -d oasis
      --db_host=odoo-db --db_user=odoo --db_password=odoo
      --db-filter=^oasis$$
    ports:
      - "8069:8069"
    restart: unless-stopped

  oasis-hub:
    build:
      context: ../..
      dockerfile: oasis_hub/Dockerfile
    environment:
      OASIS_HUB_DB_URL: sqlite:////data/oasis_hub.db
      OASIS_LICENSE_SALT: ${OASIS_LICENSE_SALT:-demo-salt}
      # No fixed admin key (finding F-8): compose fails fast until one is set.
      OASIS_HUB_ADMIN_KEY: ${OASIS_HUB_ADMIN_KEY:?set OASIS_HUB_ADMIN_KEY in .env or the shell}
      OASIS_HUB_TOKEN_SECRET: ${OASIS_HUB_TOKEN_SECRET:?set OASIS_HUB_TOKEN_SECRET in .env or the shell}
    volumes:
      - oasis-hub-data:/data
    ports:
      - "8700:8700"
    restart: unless-stopped

volumes:
  odoo-db-data:
  odoo-web-data:
  oasis-hub-data:
